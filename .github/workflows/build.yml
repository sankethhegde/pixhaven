# Builds and tests PixHaven on Windows and Linux; uploads the installers as artifacts.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y unzip libarchive-tools rpm
      - run: npm ci
      - name: Electron binary (npm 11 skips install scripts by default)
        run: node node_modules/electron/install.js
      - run: npm run setup:engine
      - run: npm run typecheck
      - run: npm test
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: npx electron-vite build && npx electron-builder --win --publish never
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: npx electron-vite build && npx electron-builder --linux --publish never
      - name: Self-test the packaged app (Linux, CPU only: runners have no GPU)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb mesa-vulkan-drivers libvulkan1
          xvfb-run -a ./dist/linux-unpacked/clearup --no-sandbox --selftest selftest.json --cpu || true
          cat selftest.json
      - uses: actions/upload-artifact@v4
        with:
          name: clearup-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            selftest.json
          if-no-files-found: ignore
