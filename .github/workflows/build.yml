# Builds and tests PixHaven on Windows and Linux on every push.
# A version tag (v0.6.0, matching package.json) also uploads the installers and update files to a DRAFT GitHub
# Release; installed copies update themselves once you press "Publish release" on GitHub.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write    # the release upload on tags

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y unzip libarchive-tools rpm perl
      - run: npm ci
      - name: Electron binary (npm 11 skips install scripts by default)
        run: node node_modules/electron/install.js
      - run: npm run setup:engine
      - run: npm run typecheck
      - name: Unit tests
        shell: bash
        # On failure, the failing tests are also posted as an annotation (readable without opening the log).
        run: |
          npm test > test.log 2>&1 && exit 0
          cat test.log
          MSG=$(grep -E "✖|Error|expected|actual|not ok|AssertionError|at .*test\.mjs" test.log | head -80 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Unit tests failed::$MSG"
          exit 1
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: npx electron-vite build && npx electron-builder --win --publish ${{ env.PUBLISH }}
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: npx electron-vite build && npx electron-builder --linux --publish ${{ env.PUBLISH }}
      - name: "Self-test the packaged app (Linux, CPU only - runners have no GPU)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb mesa-vulkan-drivers libvulkan1
          xvfb-run -a ./dist/linux-unpacked/pixhaven --no-sandbox --selftest selftest.json --cpu || true
          cat selftest.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: pixhaven-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
            selftest.json
          if-no-files-found: ignore
